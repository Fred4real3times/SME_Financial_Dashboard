[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-financial-dashboard"
version = "0.1.0"
description = "Local-first cash-flow and SME financial management dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary project; see repository terms." }
authors = [{ name = "SME Financial Dashboard contributors" }]
dependencies = [
  "streamlit==1.67.0",
  "pandas==2.2.3",
  "SQLAlchemy==2.0.50",
  "alembic==1.18.4",
  "pydantic==2.13.5",
  "plotly==6.5.2",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.9",
  "reportlab==4.4.9",
  "python-dotenv==1.2.2",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
